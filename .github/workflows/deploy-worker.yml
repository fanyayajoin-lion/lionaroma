name: 部署 Aroma Therapist Worker

on:
  workflow_dispatch:
  push:
    branches: [claude/aroma-diagnosis-handover-tuwwm]
    paths: [worker.js, wrangler.toml]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore: update WORKER_URL')"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 90ce49be451730c9295f750377adfb3e
        run: |
          # tee 讓輸出同時顯示在 log 並存檔
          wrangler deploy 2>&1 | tee /tmp/deploy_out.txt
          DEPLOY_EXIT=${PIPESTATUS[0]}

          if [ $DEPLOY_EXIT -ne 0 ]; then
            echo "❌ wrangler deploy 失敗（exit $DEPLOY_EXIT）"
            exit 1
          fi

          # 嘗試多種 URL 格式
          WORKER_URL=$(grep -oE 'https://[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+\.workers\.dev' /tmp/deploy_out.txt | head -1)

          # 若仍抓不到，直接用 wrangler 回報的網址行
          if [ -z "$WORKER_URL" ]; then
            WORKER_URL=$(grep 'workers.dev' /tmp/deploy_out.txt | grep -oE 'https://\S+' | head -1)
          fi

          if [ -z "$WORKER_URL" ]; then
            echo "⚠️  Worker 已部署，但無法自動取得 URL。deploy 輸出如上，請手動確認。"
            # 用預測 URL 繼續（帳號 subdomain 可能需調整）
            WORKER_URL="https://aroma-therapist-api.${CLOUDFLARE_ACCOUNT_ID}.workers.dev"
          fi

          echo "url=$WORKER_URL" >> $GITHUB_OUTPUT
          echo "✅ Worker URL：$WORKER_URL"

      - name: Set GEMINI_API_KEY secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 90ce49be451730c9295f750377adfb3e
        run: printf '%s' "${{ secrets.GEMINI_API_KEY }}" | wrangler secret put GEMINI_API_KEY

      - name: Set CERT_CODES secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 90ce49be451730c9295f750377adfb3e
        run: printf '%s' "TEST2026" | wrangler secret put CERT_CODES

      - name: Update WORKER_URL in aroma-system.html
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          sed -i "s|const WORKER_URL = 'YOUR_WORKER_URL'|const WORKER_URL = '$URL'|g" aroma-system.html
          echo "✅ 已將 WORKER_URL 更新為 $URL"

      - name: Commit & push updated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aroma-system.html
          git diff --staged --quiet && echo "無變更，略過 commit" || \
            git commit -m "chore: update WORKER_URL to ${{ steps.deploy.outputs.url }}"
          git push
