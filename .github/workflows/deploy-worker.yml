name: 部署 Aroma Therapist Worker

on:
  workflow_dispatch:
  push:
    branches: [claude/aroma-diagnosis-handover-tuwwm]
    paths: [worker.js, wrangler.toml]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore: update WORKER_URL')"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 90ce49be451730c9295f750377adfb3e
        run: |
          OUTPUT=$(wrangler deploy 2>&1)
          echo "$OUTPUT"
          WORKER_URL=$(echo "$OUTPUT" | grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' | head -1)
          if [ -z "$WORKER_URL" ]; then
            echo "❌ 無法取得 Worker URL，請檢查部署輸出"
            exit 1
          fi
          echo "url=$WORKER_URL" >> $GITHUB_OUTPUT
          echo "✅ Worker 部署成功：$WORKER_URL"

      - name: Set GEMINI_API_KEY secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 90ce49be451730c9295f750377adfb3e
        run: printf '%s' "${{ secrets.GEMINI_API_KEY }}" | wrangler secret put GEMINI_API_KEY

      - name: Set CERT_CODES secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 90ce49be451730c9295f750377adfb3e
        run: printf '%s' "TEST2026" | wrangler secret put CERT_CODES

      - name: Update WORKER_URL in aroma-system.html
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          sed -i "s|const WORKER_URL = 'YOUR_WORKER_URL'|const WORKER_URL = '$URL'|g" aroma-system.html
          echo "✅ 已將 WORKER_URL 更新為 $URL"

      - name: Commit & push updated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aroma-system.html
          git diff --staged --quiet && echo "無變更，略過 commit" || \
            git commit -m "chore: update WORKER_URL to ${{ steps.deploy.outputs.url }}"
          git push
